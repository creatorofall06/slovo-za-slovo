const $=id=>document.getElementById(id);
// Отдельные переключатели визуальных эффектов, коротких звуков и фоновой музыки.
let effectsOn=localStorage.getItem('szs_fx')!=='false',sfxOn=localStorage.getItem('szs_sfx')!=='false',musicOn=localStorage.getItem('szs_music')==='true';
let audioCtx=null,musicTimer=null,musicStep=0;
function audio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,duration=.12,type='sine',volume=.045,delay=0){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+delay);g.gain.setValueAtTime(.0001,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(volume,c.currentTime+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+duration);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+duration+.03)}
function sfx(kind){if(!sfxOn)return;const patterns={tap:[[520,.06]],hint:[[440,.07],[660,.09]],good:[[523,.12],[659,.12],[784,.2]],miss:[[260,.16],[190,.2]],finish:[[523,.13],[659,.13],[784,.13],[1047,.32]],start:[[392,.12],[523,.12],[659,.24]]};(patterns[kind]||patterns.tap).forEach((n,i)=>tone(n[0],n[1],'sine',.045,i*.09))}
function musicNote(){if(!musicOn)return;const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];tone(notes[musicStep%notes.length],.48,'triangle',.012);if(musicStep%4===0)tone(notes[(musicStep+2)%notes.length]/2,.65,'sine',.009);musicStep++}
function setMusic(on){musicOn=on;localStorage.setItem('szs_music',String(on));if(on){audio();musicNote();if(!musicTimer)musicTimer=setInterval(musicNote,620)}else{if(musicTimer)clearInterval(musicTimer);musicTimer=null}}
function updateAudioButtons(){document.body.classList.toggle('fx-enabled',effectsOn);[['fxToggle',effectsOn,'✨ Эффекты'],['sfxToggle',sfxOn,'🔊 Звуки'],['musicToggle',musicOn,'🎵 Музыка']].forEach(([id,on,label])=>{const b=$(id);b.textContent=label+': '+(on?'ВКЛ':'ВЫКЛ');b.classList.toggle('off',!on);b.setAttribute('aria-pressed',String(on))})}
$('fxToggle').onclick=()=>{effectsOn=!effectsOn;localStorage.setItem('szs_fx',String(effectsOn));updateAudioButtons();sfx('tap')};
$('sfxToggle').onclick=()=>{audio();sfxOn=!sfxOn;localStorage.setItem('szs_sfx',String(sfxOn));updateAudioButtons();sfx('tap')};
$('musicToggle').onclick=()=>{setMusic(!musicOn);updateAudioButtons();if(sfxOn)sfx('tap')};
function confetti(){if(!effectsOn)return;for(let i=0;i<34;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#a78bfa','#27b879','#ffd166','#e34f68','#58c4dd'][i%5];e.style.setProperty('--drift',(Math.random()*160-80)+'px');e.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}}
updateAudioButtons();
function show(id){['menu','setup','game','results'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function draw(n){let out=[];while(out.length<n){if(!bag.length)bag=shuffle(bank);let w=bag.pop();if(!out.includes(w))out.push(w)}return out}
function renderPlayers(){$('players').innerHTML=players.map((p,i)=>`<div class="player"><span>${i+1}. ${esc(p)}</span><button class="danger" data-remove="${i}" style="padding:7px 11px">×</button></div>`).join('');$('startBtn').disabled=(mode==='host'||mode==='team')?!$('hostInput').value.trim()||players.length<1:players.length<2}
function chooseMode(m){mode=m;players=[];bag=shuffle(bank);$('nameInput').value='';$('hostInput').value='';$('hostField').classList.toggle('hidden',m!=='host'&&m!=='team');$('setupTitle').textContent=(m==='host'||m==='team')?'Ведущий и участники':'Кто играет?';if(m==='team')$('nameInput').placeholder='Название команды';else $('nameInput').placeholder='Имя участника';$('setupNote').textContent=m==='host'?'Введи имя ведущего и добавь участников. В одном раунде 7 загаданых слов и 20 слов-подсказок.':m==='team'?'Введи имя ведущего и добавь названия команд. Правила как в режиме с ведущим.':'Добавь минимум двух участников. В одном раунде 7 загаданых слов и 20 слов-подсказок.';renderPlayers();show('setup')}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>chooseMode(b.dataset.mode));
$('backMenu').onclick=()=>show('menu');$('addBtn').onclick=()=>{let v=$('nameInput').value.trim();if(v&&players.length<12&&!players.some(x=>x.toLowerCase()===v.toLowerCase())){players.push(v);$('nameInput').value='';renderPlayers()}};
$('nameInput').onkeydown=e=>{if(e.key==='Enter')$('addBtn').click()};$('hostInput').oninput=renderPlayers;$('players').onclick=e=>{let b=e.target.closest('[data-remove]');if(b){players.splice(+b.dataset.remove,1);renderPlayers()}};
function start(){audio();sfx('start');scores=players.map(name=>({name,points:0,hintsUsed:0,done:0}));turn=0;hostName=$('hostInput').value.trim()||'Ведущий';bag=shuffle(bank);const splash=document.createElement('div');splash.className='launch';splash.innerHTML='<div class="launch-logo">💬</div><h1>СЛОВО ЗА СЛОВО</h1><div>Приготовьтесь!</div>';document.body.appendChild(splash);setTimeout(()=>{splash.remove();newRound()},1750)}
function newRound(){stopTimer();roundWords=draw(7);idx=0;selectedHints=new Set();roundHintTotal=0;roundPoints=0;timeLeft=60;renderGame();show('game');startTimer()}
function renderGame(){let p=players[turn],word=roundWords[idx];$('turnLabel').textContent=(mode==='host'||mode==='team')?`Ведущий: ${hostName} · ${mode==='team'?'Команда':'Участник'}: ${p}`:`Ход игрока: ${p}`;$('wordProgress').textContent=`Загаданное слово ${idx+1} из 7`;$('progress').style.width=(idx/7*100)+'%';$('targetWord').textContent=word;$('wordCaption').textContent=(mode==='host'||mode==='team')?'ВЕДУЩИЙ ПОКАЗЫВАЕТ СЛОВО':'ОБЪЯСНИ ЭТО СЛОВО';$('usedCount').textContent=`${roundHintTotal} / 20`;$('timer').textContent=`⏱ ${timeLeft}`;$('timer').classList.toggle('urgent',timeLeft<=10);let hs=clues[word];document.querySelectorAll('[data-hint]').forEach((b,i)=>{b.textContent=hs[i];b.classList.toggle('used',selectedHints.has(i));b.disabled=!selectedHints.has(i)&&roundHintTotal>=20});$('gameNote').textContent=(mode==='host'||mode==='team')?'Ведущий показывает слово и выбирает любые подсказки. Нельзя произносить загаданное слово, показывать жестами или задавать вопросы.':'Объясняй слово, выбирая любые подсказки. Нельзя произносить загаданное слово, показывать жестами или задавать вопросы. На раунд даётся 60 секунд.'}
function startTimer(){stopTimer();timerId=setInterval(()=>{timeLeft--;if(timeLeft<=0){timeLeft=0;$('timer').textContent='⏱ 0';stopTimer();finish(true)}else{$('timer').textContent=`⏱ ${timeLeft}`;$('timer').classList.toggle('urgent',timeLeft<=10)}},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{sfx('hint');let n=Number(b.dataset.hint)-1;if(selectedHints.has(n)){selectedHints.delete(n);roundHintTotal--}else if(roundHintTotal<20){selectedHints.add(n);roundHintTotal++}$('usedCount').textContent=`${roundHintTotal} / 20`;document.querySelectorAll('[data-hint]').forEach((x,i)=>{x.classList.toggle('used',selectedHints.has(i));x.disabled=!selectedHints.has(i)&&roundHintTotal>=20})});
function advance(ok){if(ok)roundPoints++;idx++;selectedHints=new Set();if(idx>=7){finish(false);return}renderGame()}
function finish(timeout=false){stopTimer();sfx('finish');confetti();let s=scores[turn];s.points+=roundPoints;s.hintsUsed=(s.hintsUsed||0)+roundHintTotal;s.done++;$('resultIcon').textContent=roundPoints===7?'🏆':'🎯';$('resultTitle').textContent=`${s.name}: раунд завершён`;$('resultText').textContent=`Угадано ${roundPoints} из 7 слов. Использовано ${roundHintTotal} слов-подсказок из 20.${timeout?' Время вышло.':''}`;$('scoreList').innerHTML=scores.map(x=>`<div class="scoreline"><span>${esc(x.name)}</span><strong>${x.points} слов <span class="tag">· ${x.hintsUsed||0} подсказок</span></strong></div>`).join('');$('nextBtn').classList.remove('hidden');$('nextBtn').textContent=turn===players.length-1?'Завершить игру':'Следующий ход';show('results')}
$('guessedBtn').onclick=()=>{sfx('good');advance(true)};$('missedBtn').onclick=()=>{sfx('miss');advance(false)};$('startBtn').onclick=start;
$('nextBtn').onclick=()=>{if(turn<players.length-1){turn++;newRound()}else{scores.sort((a,b)=>b.points-a.points||(a.hintsUsed||0)-(b.hintsUsed||0));$('resultIcon').textContent='🏆';$('resultTitle').textContent='Игра завершена!';$('resultText').textContent=`Победитель: ${scores[0].name} — больше всего угаданных слов; при равенстве побеждает тот, кто использовал меньше подсказок.`;$('scoreList').innerHTML=scores.map((x,i)=>`<div class="scoreline"><span>${i+1}. ${esc(x.name)}</span><strong>${x.points} угадано · ${x.hintsUsed||0} подсказок</strong></div>`).join('');$('nextBtn').classList.add('hidden');show('results')}};
$('restartBtn').onclick=()=>{stopTimer();players=[];$('nextBtn').classList.remove('hidden');renderPlayers();show('menu')};show('menu');
</script></body></html>
